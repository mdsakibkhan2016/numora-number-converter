<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <!-- UPDATED PROJECT NAME -->
    <title>Numora | Advanced Number System Converter & Calculator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- UPDATED DESCRIPTION -->
    <meta name="description" content="Numora is a modern number base converter and calculator designed and developed by Md Sakib Khan.">


    <!-- ADDED AUTHOR -->
    <meta name="author" content="Md Sakib Khan">


    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <div class="app-wrapper">


    <div class="container">


        <!-- UPDATED TITLE -->
        <h1>Numora</h1>

        <p>
            Advanced Number System Converter
        </p>


        <div class="converter">


            <input type="text" id="value" placeholder="Enter number">


            <select id="from">

                <option value="bin">Binary</option>

                <option value="oct">Octal</option>

                <option value="dec" selected>Decimal</option>

                <option value="hex">Hexadecimal</option>

            </select>


            <button onclick="convert()">
                Convert
            </button>


            <div class="result" id="output">
            </div>


        </div>



        <hr>



        <h1>Number Base Calculator</h1>


        <div class="calculator">


            <div class="calc-input-group">


                <input type="text" id="num1" placeholder="Enter first number">


                <select id="base1">


                    <option value="bin">Binary</option>

                    <option value="oct">Octal</option>

                    <option value="dec" selected>Decimal</option>

                    <option value="hex">Hexadecimal</option>


                </select>


            </div>




            <select id="operation">

                <option value="add">
                    Addition (+)
                </option>

                <option value="subtract">
                    Subtraction (-)
                </option>

                <option value="multiply">
                    Multiplication (*)
                </option>

                <option value="divide">
                    Division (/)
                </option>

            </select>




            <div class="calc-input-group">


                <input type="text" id="num2" placeholder="Enter second number">



                <select id="base2">


                    <option value="bin">Binary</option>

                    <option value="oct">Octal</option>

                    <option value="dec" selected>Decimal</option>

                    <option value="hex">Hexadecimal</option>


                </select>


            </div>



            <button onclick="calculate()">
                Calculate
            </button>



            <div class="result" id="calculator-output">
            </div>



        </div>


    </div>




    <!-- UPDATED FOOTER -->

    <footer class="site-footer">


        <div>


            <strong>
                Numora
            </strong>



            <p>
                Advanced Number System Converter & Calculator
            </p>



            <p>
                Design and Developed by 
                <span>
                    Md Sakib Khan
                </span>
            </p>



            <p>
                © 2026 Numora. All Rights Reserved.
            </p>



            <p>
                Licensed under MIT License
            </p>



            <p class="footer-tech">
                HTML • CSS • JavaScript | Responsive Web Application
            </p>



        </div>


    </footer>



    <script src="script.js"></script>


</body>

</html>
